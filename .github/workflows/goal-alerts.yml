name: Goal-owed alerts (fallback)

# Manual fallback only. The PRIMARY low-latency scheduler is cron-job.org hitting
# the Vercel endpoint /api/alerts/check every ~60s. This workflow shares the same
# Upstash de-dup state (when UPSTASH_* secrets are set), so running it manually
# never double-sends. Kept as a backup if the external cron is down.

on:
  workflow_dispatch: {} # run on demand from the Actions tab

concurrency:
  group: goal-alerts
  cancel-in-progress: false # never interrupt a run mid-send

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Restore the persisted "already alerted" state from the most recent run.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run alert check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          # Share de-dup state with the Vercel endpoint (primary scheduler).
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Read from either a repo Variable or Secret; default 0.8 if unset.
          ALERT_GOALS_OWED_THRESHOLD: ${{ vars.ALERT_GOALS_OWED_THRESHOLD || secrets.ALERT_GOALS_OWED_THRESHOLD || '0.8' }}
          # Optional deployed dashboard URL (scheme auto-added if missing; a bad
          # value falls back to direct FotMob). Variable or Secret both work.
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
        run: npx tsx scripts/alert-check.ts

      # Save the updated state under a fresh key (cache keys are immutable).
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
